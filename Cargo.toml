[package]
name = "wukong-easy-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Lightweight async Rust SDK for WuKongIM WebSocket JSON-RPC messaging"
license = "ISC"
repository = "https://github.com/WuKongIM/WuKongEasySDK-Rust"
readme = "README.md"
keywords = ["wukongim", "im", "websocket", "sdk", "async"]
categories = ["network-programming", "asynchronous"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README*", "LICENSE", "CHANGELOG.md", "docs/**"]

[dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3.31", features = ["sink"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["net", "sync", "time", "rt", "macros"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.14", features = ["rt"] }
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "test-util", "io-util", "io-std", "signal"] }
