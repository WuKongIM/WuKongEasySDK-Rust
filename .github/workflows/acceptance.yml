name: Real server acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seconds:
        description: Sustained WSS messaging duration
        type: choice
        options: ['120', '600']
        default: '600'
      network_seconds:
        description: Weak-network and resource validation duration
        type: choice
        options: ['30', '1800']
        default: '30'
permissions:
  contents: read
jobs:
  interoperability:
    strategy:
      fail-fast: false
      matrix:
        distribution: [source, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: WuKongIM/WuKongIM
          ref: 27a39f15bf163b433f417b78ab6bfc6e589585e5
          path: test-server
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.11'
          cache-dependency-path: test-server/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.12.0'
      - name: Install Rust
        run: rustup toolchain install 1.86.0 --profile minimal && rustup default 1.86.0
      - name: Verify bounded wire audit parser
        run: python3 -m unittest discover -s tests/acceptance -p "test_*.py"
      - name: Verify TLS and protocol contracts
        run: cargo test --locked
      - name: Verify WSS messaging, group permissions, weak network and cleanup
        env:
          TEST_DISTRIBUTION: ${{ matrix.distribution }}
          TEST_SECONDS: ${{ inputs.seconds || '120' }}
          NETWORK_SECONDS: ${{ inputs.network_seconds || '30' }}
        run: python3 tests/acceptance/run.py --server-source test-server --distribution "$TEST_DISTRIBUTION" --seconds "$TEST_SECONDS" --network-seconds "$NETWORK_SECONDS"
      - name: Retain successful acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-sdk-acceptance-${{ matrix.distribution }}-${{ github.sha }}
          path: .acceptance/receipt.json
          if-no-files-found: error
          retention-days: 30
